<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salud+ | Inicio</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="dashboard">

        <!-- ENCABEZADO -->
        <header class="dashboard-header">

            <h1>
                ¡Hola, <span id="nombreUsuario">Usuario</span>! 👋
            </h1>

            <button
                type="button"
                class="boton-campana"
                onclick="mostrarNotificaciones()">
                ♧
            </button>

        </header>


        <!-- ESTADO EMOCIONAL -->
        <section
            class="tarjeta-sentimiento"
            onclick="irAEmocional()">

            <div>

                <h2>
                    ¿Cómo te sientes hoy?
                </h2>

                <p>
                    Cuéntanos cómo está tu día
                </p>

            </div>

            <div class="cara-feliz">
                🙂
            </div>

            <span class="flecha">
                ›
            </span>

        </section>


        <!-- CUADRÍCULA PRINCIPAL -->
        <section class="tarjetas-dashboard">


            <!-- MEDICAMENTOS -->
            <button
                type="button"
                class="dashboard-card"
                onclick="irAMedicamentos()">

                <div class="dashboard-card-icono">
                    💊
                </div>

                <div class="dashboard-card-contenido">

                    <h3>
                        Medicamentos
                    </h3>

                    <p id="resumenMedicamentos">
                        Sin medicamentos registrados
                    </p>

                </div>

            </button>


            <!-- CITAS -->
            <button
                type="button"
                class="dashboard-card"
                onclick="irACitas()">

                <div class="dashboard-card-icono">
                    📅
                </div>

                <div class="dashboard-card-contenido">

                    <h3>
                        Citas médicas
                    </h3>

                    <p id="resumenCitas">
                        Sin citas registradas
                    </p>

                </div>

            </button>


            <!-- BIENESTAR -->
            <button
                type="button"
                class="dashboard-card"
                onclick="irABienestar()">

                <div class="dashboard-card-icono">
                    💚
                </div>

                <div class="dashboard-card-contenido">

                    <h3>
                        Bienestar
                    </h3>

                    <p id="resumenBienestarDashboard">
                        Ver mi progreso
                    </p>

                </div>

            </button>


            <!-- ESTADO EMOCIONAL -->
            <button
                type="button"
                class="dashboard-card"
                onclick="irAEmocional()">

                <div class="dashboard-card-icono">
                    🙂
                </div>

                <div class="dashboard-card-contenido">

                    <h3>
                        Estado emocional
                    </h3>

                    <p id="resumenEmocional">
                        Sin registro
                    </p>

                </div>

            </button>

        </section>


        <!-- RECORDATORIOS -->
        <button
            type="button"
            class="recordatorio"
            onclick="mostrarRecordatorios()">

            <div class="recordatorio-icono">
                ♥
            </div>

            <div class="recordatorio-texto">

                <span id="textoRecordatorio">
                    Tienes 2 recordatorios
                </span>

                <span>
                    para hoy
                </span>

            </div>

            <div class="recordatorio-campana">
                ♧
            </div>

        </button>


        <!-- BARRA INFERIOR -->
        <nav class="barra-inferior">

            <!-- INICIO -->
            <button
                type="button"
                class="nav-item activo"
                onclick="irAInicio()">

                <span class="nav-icono">
                    🏠
                </span>

                <span>
                    Inicio
                </span>

            </button>


            <!-- HISTORIAL -->
            <button
                type="button"
                class="nav-item"
                onclick="irAHistorial()">

                <span class="nav-icono">
                    ▤
                </span>

                <span>
                    Historial
                </span>

            </button>


            <!-- AJUSTES -->
            <button
                type="button"
                class="nav-item"
                onclick="irAAjustes()">

                <span class="nav-icono">
                    ⚙
                </span>

                <span>
                    Ajustes
                </span>

            </button>

        </nav>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
