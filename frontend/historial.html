<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Salud+ | Historial</title>

    <meta name="theme-color" content="#08a34b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Salud+">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/icono.svg">

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <main class="historial-pantalla">

        <!-- ENCABEZADO -->

        <header class="historial-header">

            <button
                type="button"
                class="boton-regresar-historial"
                onclick="volverDashboard()">

                ←

            </button>

            <h1>
                Mi historial
            </h1>

            <div class="espacio-header-historial"></div>

        </header>


        <!-- TÍTULO -->
        <section class="historial-titulo">

            <h2>
                Mis registros
            </h2>

            <p id="descripcionHistorial">
                Aquí puedes consultar todo lo que has registrado.
            </p>

        </section>


        <!-- FILTRO -->
        <div class="historial-filtro filtros-historial" role="tablist">

            <button
                type="button"
                class="filtro-historial filtro-activo"
                data-filtro="todos"
                onclick="filtrarHistorial('todos')">
                📋 Todo
            </button>

            <button
                type="button"
                class="filtro-historial"
                data-filtro="emocional"
                onclick="mostrarHistorialEmocional()">
                😊 Estados emocionales
            </button>

            <button
                type="button"
                class="filtro-historial"
                data-filtro="medicamentos"
                onclick="filtrarHistorial('medicamentos')">
                💊 Medicamentos
            </button>

            <button
                type="button"
                class="filtro-historial"
                data-filtro="citas"
                onclick="filtrarHistorial('citas')">
                📅 Citas
            </button>

            <button
                type="button"
                class="filtro-historial"
                data-filtro="bienestar"
                onclick="filtrarHistorial('bienestar')">
                💚 Bienestar
            </button>

        </div>


        <!-- LISTA -->

        <section
            id="listaHistorial"
            class="lista-historial">

        </section>


        <!-- NAVEGACIÓN -->

        <nav class="barra-inferior">

            <button
                type="button"
                class="nav-item"
                onclick="irAInicio()">

                <span class="nav-icono">
                    🏠
                </span>

                <span>
                    Inicio
                </span>

            </button>


            <button
                type="button"
                class="nav-item activo">

                <span class="nav-icono">
                    ▤
                </span>

                <span>
                    Historial
                </span>

            </button>


            <button
                type="button"
                class="nav-item"
                onclick="irAAjustes()">

                <span class="nav-icono">
                    ⚙
                </span>

                <span>
                    Ajustes
                </span>

            </button>

        </nav>

    </main>


    <script src="js/comun.js"></script>


    <script src="js/historial.js"></script>

</body>

</html>
