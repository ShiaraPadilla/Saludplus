<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Salud+ | Iniciar sesión</title>

    <meta name="theme-color" content="#08a34b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Salud+">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/icono.svg">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="login-pantalla">

        <!-- LOGO -->
        <div class="login-logo">

            <div class="logo-salud-icono">
                <span>+</span>
            </div>

            <span class="logo-salud-texto">
                Salud+
            </span>

        </div>


        <!-- BIENVENIDA -->
        <div class="login-titulo">

            <h1>Bienvenido</h1>

            <p>Inicia sesión para continuar</p>

        </div>


        <!-- SELECTOR -->
        <div class="selector-login">

            <button
                type="button"
                class="selector-activo">
                Iniciar sesión
            </button>

            <button
                type="button"
                class="selector-inactivo"
                onclick="crearCuenta()">
                Crear cuenta
            </button>

        </div>


        <!-- FORMULARIO -->
        <form id="formLogin" class="form-login">


            <!-- CORREO -->
            <div class="campo-login">

                <span class="campo-icono" aria-hidden="true">✉</span>

                <input
                    type="email"
                    id="correo"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                    inputmode="email"
                    aria-label="Correo electrónico"
                    required
                >

            </div>


            <!-- CONTRASEÑA -->
            <div class="campo-login">

                <span class="campo-icono" aria-hidden="true">🔒</span>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    aria-label="Contraseña"
                    required
                >

                <button
                    type="button"
                    class="ojo-password"
                    aria-label="Mostrar u ocultar contraseña"
                    onclick="mostrarContrasena()">
                    👁
                </button>

            </div>


            <!-- RECUPERAR CONTRASEÑA -->
            <div class="recuperar">

                <a
                    href="#"
                    onclick="recuperarContrasena(event)">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>


            <!-- INICIAR SESIÓN -->
            <button
                type="submit"
                class="boton-iniciar">
                Iniciar sesión
            </button>

        </form>


        <!-- SEPARADOR -->
        <div class="separador-login">

            <span></span>

            <b>o</b>

            <span></span>

        </div>


        <!-- GOOGLE -->
        <button
            type="button"
            class="boton-google"
            onclick="continuarGoogle()">

            <span class="google-letra">G</span>

            <span>Continuar con Google</span>

        </button>


        <!-- CREAR CUENTA -->
        <div class="crear-cuenta">

            <span>¿No tienes cuenta?</span>

            <a
                href="registro.html"
                onclick="crearCuenta(event)">
                Crear cuenta
            </a>

        </div>

    </main>


    <script src="js/comun.js"></script>


    <script src="js/app.js"></script>

</body>

</html>
