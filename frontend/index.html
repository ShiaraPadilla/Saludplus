<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Salud+</title>

    <meta name="theme-color" content="#08a34b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Salud+">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/icono.svg">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="pantalla-inicio">

        <!-- LOGO -->
        <div class="logo">
            <div class="logo-icono">+</div>

            <h1>
                Salud<span>+</span>
            </h1>
        </div>


        <!-- ILUSTRACIÓN -->
        <div class="ilustracion">

            <img 
                src="img/adultos-mayores.png" 
                alt="Adultos mayores"
            >

        </div>


        <!-- MENSAJE PRINCIPAL -->
        <div class="mensaje">

            <p>
                Tu bienestar,<br>
                nuestra prioridad
            </p>

        </div>


        <!-- BOTONES -->
        <div class="botones">

            <button 
                class="btn-comenzar"
                onclick="comenzar()"
            >
                Comenzar
            </button>


            <button 
                class="btn-conocer"
                onclick="conocerMas()"
            >
                Conocer más
            </button>

        </div>

    </main>


    <script src="js/comun.js"></script>


    <script src="js/app.js"></script>

</body>

</html>
